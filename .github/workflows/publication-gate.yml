name: Publication Gate
on:
  pull_request:
permissions: {contents: read}
concurrency: {group: 'publication-gate-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  publication-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publication gate
        run: |
          python3 -B tools/check_publication_gate.py --selftest
          python3 -B tools/check_publication_gate.py --root . --account-slug shojikumaru
